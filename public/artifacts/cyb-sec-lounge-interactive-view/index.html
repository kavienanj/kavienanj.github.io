<body>
<title>Huawei Lab Lounge 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: full-bleed 3D canvas, one floating control panel (top-left) and a camera read-out bar (bottom). */
:root {
  --red: #E10600;
  --ink: #111111;
  --paper: #FFFFFF;
  --muted: #6B6B6B;
  --line: #E2E2E2;
  --panel: rgba(255,255,255,0.94);
  --chip: #F3F3F3;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #F2F2F2; --paper: #161616; --muted: #A3A3A3; --line: #333333;
  --panel: rgba(22,22,22,0.92); --chip: #242424; color-scheme: dark } }
:root[data-theme="dark"] {
  --ink: #F2F2F2; --paper: #161616; --muted: #A3A3A3; --line: #333333;
  --panel: rgba(22,22,22,0.92); --chip: #242424; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

.panel {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: calc(max(16px, env(safe-area-inset-left, 0px)));
  width: min(300px, calc(100vw - 32px));
  max-height: calc(100% - 90px);
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 4px solid var(--red);
  backdrop-filter: blur(6px);
  font-size: 13px;
}
.panel summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 14px 10px;
}
.panel summary::-webkit-details-marker { display: none; }
.panel h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.panel .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.caret { font-size: 11px; color: var(--muted); transition: transform .15s; }
details[open] .caret { transform: rotate(180deg); }
.body { padding: 0 14px 14px; display: grid; gap: 14px; }
.label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 8px 0; font: 600 12.5px var(--sans); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.views button {
  text-align: left; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  padding: 7px 8px; font: 500 12px var(--sans); cursor: pointer;
}
.views button:hover { border-color: var(--ink); }
.views button.on { border-color: var(--red); box-shadow: inset 3px 0 0 var(--red); }

.toggles { display: grid; gap: 6px; }
.toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggles input { accent-color: var(--red); width: 15px; height: 15px; margin: 0; }

.help { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }
.help b { color: var(--ink); font-weight: 600; }

button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.readout {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border-top: 1px solid var(--line);
  font-size: 12px;
}
.readout code { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.readout .tag { font-weight: 700; color: var(--red); letter-spacing: 0.06em; font-size: 10.5px; text-transform: uppercase; }
.readout button { margin-left: auto; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 5px 10px; font: 600 12px var(--sans); cursor: pointer; }

.pad { position: fixed; right: calc(max(16px, env(safe-area-inset-right, 0px))); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 4px; }
.pad button { background: var(--panel); border: 1px solid var(--line); color: var(--ink); font: 600 16px var(--sans); cursor: pointer; touch-action: none; user-select: none; }
.pad button:active { background: var(--red); color: #fff; }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }

[hidden] { display: none !important; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
</style>

<div id="stage"></div>
<div id="err" hidden>The 3D view needs WebGL, which this browser has turned off. Try another browser or enable hardware acceleration.</div>

<details class="panel" id="panel" open>
  <summary>
    <div>
      <h1>Student Lounge · 3D</h1>
      <div class="sub">Huawei Lab · 5.80 m × 11.30 m · 2.70 m ceiling</div>
    </div>
    <span class="caret" aria-hidden="true">▼</span>
  </summary>
  <div class="body">
    <div>
      <div class="label">Mode</div>
      <div class="seg" role="group" aria-label="Navigation mode">
        <button id="mOrbit" aria-pressed="true">Orbit</button>
        <button id="mWalk" aria-pressed="false">Walk</button>
      </div>
    </div>
    <div>
      <div class="label">Views</div>
      <div class="views" id="views"></div>
    </div>
    <div>
      <div class="label">Show</div>
      <div class="toggles">
        <label><input type="checkbox" id="tWalk"> Walkway on floor</label>
        <label><input type="checkbox" id="tCeil" checked> Ceiling when inside</label>
        <label><input type="checkbox" id="tShadow" checked> Shadows</label>
      </div>
    </div>
    <p class="help" id="help"></p>
  </div>
</details>

<div class="pad" id="pad" hidden>
  <button class="up" data-k="f" aria-label="Walk forward">▲</button>
  <button class="left" data-k="l" aria-label="Step left">◀</button>
  <button class="down" data-k="b" aria-label="Walk back">▼</button>
  <button class="right" data-k="r" aria-label="Step right">▶</button>
</div>

<div class="readout">
  <span class="tag" id="rTag">Camera</span>
  <code id="rCam">–</code>
  <button id="copy">Copy view</button>
</div>

const orbit = new OrbitControls(camera, renderer.domElement);

let mode = "orbit";
const walk = { yaw: 0, pitch: 0, keys: new Set(), drag: null };
const EYE = 1.6;
const inside = (x, z) =>
  (x > 0.25 && x < D.W - 0.25 && z > 0.25 && z < D.L - 0.25) ||
  (x > -SR.w + 0.25 && x < -0.25 && z > SRZ0 + 0.25 && z < SRZ1 - 0.25) ||
  (x >= -0.4 && x <= 0.4 && z > D.part_door[0] + 0.15 && z < D.part_door[1] - 0.15);

function goView(name) {
  const v = VIEWS[name]; activeView = name; markView();
  if (mode === "walk" && v.p[1] < 2.6 && inside(v.p[0], v.p[2])) {
    camera.position.set(v.p[0], EYE, v.p[2]);
    const dx = v.t[0] - v.p[0], dy = v.t[1] - EYE, dz = v.t[2] - v.p[2];
    walk.yaw = Math.atan2(-dx, -dz); walk.pitch = Math.atan2(dy, Math.hypot(dx, dz));
    applyWalk(); return;
  }
  if (mode === "walk") setMode("orbit");
  camera.position.set(...v.p); orbit.target.set(...v.t); orbit.update();
}
function applyWalk() {
  camera.rotation.order = "YXZ";
  camera.rotation.set(walk.pitch, walk.yaw, 0);
}
function setMode(m) {
  mode = m;
  document.getElementById("mOrbit").setAttribute("aria-pressed", m === "orbit");
  document.getElementById("mWalk").setAttribute("aria-pressed", m === "walk");
  document.getElementById("pad").hidden = m !== "walk";
  orbit.enabled = m === "orbit";
  const help = document.getElementById("help");
  if (m === "walk") {
    help.innerHTML = "<b>Drag</b> to look around. <b>W A S D</b> or arrow keys to walk, or use the pad. Walls stop you; you can walk through the partition door.";
    let x = camera.position.x, z = camera.position.z;
    if (!inside(x, z)) { x = 5.2; z = 0.6; }
    const t = orbit.target, dx = t.x - x, dz = t.z - z;
    camera.position.set(x, EYE, z);
    walk.yaw = (Math.hypot(dx, dz) > 0.1) ? Math.atan2(-dx, -dz) : Math.PI * 0.85; walk.pitch = -0.05;
    if (!inside(5.2, 0.6) || camera.position.distanceTo(new THREE.Vector3(5.2, EYE, 0.6)) > 30) {}
    applyWalk();
  } else {
    help.innerHTML = "<b>Drag</b> to rotate, <b>scroll</b> or pinch to zoom, <b>right-drag</b> or two fingers to pan. Pick a view to jump to it.";
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    orbit.target.copy(camera.position).addScaledVector(dir, 3); orbit.target.y = Math.max(0.3, orbit.target.y);
    orbit.update();
  }
}
document.getElementById("mOrbit").addEventListener("click", () => setMode("orbit"));
document.getElementById("mWalk").addEventListener("click", () => setMode("walk"));

const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => { if (mode !== "walk") return; walk.drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); activeView = null; markView(); });
cv.addEventListener("pointermove", e => {
  if (mode !== "walk" || !walk.drag) return;
  walk.yaw -= (e.clientX - walk.drag.x) * 0.0045;
  walk.pitch = Math.max(-1.2, Math.min(1.2, walk.pitch - (e.clientY - walk.drag.y) * 0.0045));
  walk.drag = { x: e.clientX, y: e.clientY }; applyWalk();
});
cv.addEventListener("pointerup", () => walk.drag = null);
const keyMap = { KeyW: "f", ArrowUp: "f", KeyS: "b", ArrowDown: "b", KeyA: "l", ArrowLeft: "l", KeyD: "r", ArrowRight: "r" };
addEventListener("keydown", e => { if (mode === "walk" && keyMap[e.code]) { walk.keys.add(keyMap[e.code]); e.preventDefault(); } });
addEventListener("keyup", e => { if (keyMap[e.code]) walk.keys.delete(keyMap[e.code]); });
for (const b of document.querySelectorAll(".pad button")) {
  b.addEventListener("pointerdown", e => { walk.keys.add(b.dataset.k); b.setPointerCapture(e.pointerId); });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => walk.keys.delete(b.dataset.k));
}

// ---------- toggles ----------
const tWalk = document.getElementById("tWalk"), tCeil = document.getElementById("tCeil"), tShadow = document.getElementById("tShadow");
tWalk.addEventListener("change", () => walkMesh.visible = tWalk.checked);
tShadow.addEventListener("change", () => { renderer.shadowMap.enabled = tShadow.checked; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); });

// ---------- read-out ----------
const rCam = document.getElementById("rCam");
const f = v => v.toFixed(2);
function viewString() {
  const p = camera.position;
  if (mode === "orbit") { const t = orbit.target; return `pos ${f(p.x)}, ${f(p.y)}, ${f(p.z)}  →  target ${f(t.x)}, ${f(t.y)}, ${f(t.z)}`; }
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const t = p.clone().addScaledVector(dir, 3);
  return `pos ${f(p.x)}, ${f(p.y)}, ${f(p.z)}  →  target ${f(t.x)}, ${f(t.y)}, ${f(t.z)}`;
}
document.getElementById("copy").addEventListener("click", async e => {
  const s = (activeView ? activeView + ": " : "") + viewString();
  const btn = e.currentTarget;
  try { await navigator.clipboard.writeText(s); btn.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents(rCam); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = "Selected"; }
  setTimeout(() => btn.textContent = "Copy view", 1400);
});

// ---------- loop ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const clock = new THREE.Clock();
let lastStr = "";
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode === "walk" && walk.keys.size) {
    const sp = 1.6 * dt, fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw);
    let dx = 0, dz = 0;
    if (walk.keys.has("f")) { dx += fx; dz += fz; } if (walk.keys.has("b")) { dx -= fx; dz -= fz; }
    if (walk.keys.has("l")) { dx += fz; dz -= fx; } if (walk.keys.has("r")) { dx -= fz; dz += fx; }
    const len = Math.hypot(dx, dz) || 1, nx = camera.position.x + dx / len * sp, nz = camera.position.z + dz / len * sp;
    if (inside(nx, nz)) camera.position.set(nx, EYE, nz);
    else if (inside(nx, camera.position.z)) camera.position.x = nx;
    else if (inside(camera.position.x, nz)) camera.position.z = nz;
  }
  if (mode === "orbit") orbit.update();
  const p = camera.position;
  ceiling.visible = tCeil.checked && p.y < H - 0.05 && inside(p.x, p.z);
  const cut = mode === "orbit" && !inside(p.x, p.z);
  for (const k in OUT) G[k].visible = !(cut && OUT[k](p));
  renderer.render(scene, camera);
  const s = viewString(); if (s !== lastStr) { rCam.textContent = s; lastStr = s; }
  document.getElementById("rTag").textContent = activeView ? activeView : (mode === "walk" ? "Walking" : "Camera");
  requestAnimationFrame(tick);
}
setMode("orbit");
goView("Overview");
tick();
window.__lounge = { goView, setMode, VIEWS, camera, orbit };
</script>
